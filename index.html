<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlavorNest</title>

  <!-- Google fonts used in your originals -->
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Pacifico&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ---------------------------
       LOGIN OVERLAY (scoped)
       I scoped all login styles under #loginOverlay to avoid clashing
       with the main site's styles.
       --------------------------- */
    #loginOverlay {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
    }
    #loginOverlay .bg {
      position: absolute;
      inset: 0;
      background: url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c") no-repeat center center/cover;
      filter: blur(2px) brightness(.6);
      z-index: -1;
    }
    #loginOverlay .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 28px 34px;
      border-radius: 12px;
      box-shadow: 0px 6px 30px rgba(0,0,0,0.35);
      width: 360px;
      text-align: center;
    }
    #loginOverlay * { box-sizing: border-box; font-family: "Poppins", sans-serif; }
    #loginOverlay .logo { font-size: 28px; font-weight: 700; color: #5c3317; margin-bottom: 12px; }
    #loginOverlay .logo span { color: #ff5c00; }
    #loginOverlay input { width:100%; padding:10px 12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; outline:none; }
    #loginOverlay button { width:100%; padding:10px; background:#ff5c00; border:none; border-radius:8px; color:#fff; font-size:16px; cursor:pointer; transition:0.2s; }
    #loginOverlay button:hover { background:#e14c00; }
    #loginOverlay .switch { margin-top:12px; color:#333; font-size:14px; }
    #loginOverlay .switch span { color:#ff5c00; cursor:pointer; font-weight:600; }
    #loginOverlay .hidden { display:none; }
    #loginOverlay h2 { margin-bottom:6px; color:#5c3317; }

    /* ---------------------------
       MAIN SITE STYLES (unchanged, minimal reformatting)
       from your FlavorNest file (kept same)
       --------------------------- */
    body{font-family:'Roboto',sans-serif;margin:0;background:linear-gradient(135deg,#fff7f0,#f0fff7);color:#333;overflow-x:hidden}
    header{background:url('https://images.pexels.com/photos/1050303/pexels-photo-1050303.jpeg') center/cover;color:white;text-align:center;padding:2rem;position:relative;box-shadow:0 4px 20px rgba(0,0,0,.2)}
    header::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35)}
    header h1{font-family:'Pacifico',cursive;font-size:2.8rem;position:relative;z-index:1;background:linear-gradient(90deg,#ff6f61,#ffcc70);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    header .tagline{position:relative;z-index:1;font-style:italic;color:#fff8f0;margin-top:.5rem}
    nav{display:flex;justify-content:center;gap:1rem;margin:1rem 0}
    nav button{background:linear-gradient(45deg,#ffb347,#ffcc70);border:none;padding:.6rem 1.5rem;border-radius:25px;color:white;cursor:pointer;font-weight:500;transition:.3s}
    nav button:hover{transform:scale(1.05);box-shadow:0 8px 25px rgba(255,179,71,.5)}
    nav button.active{box-shadow:0 4px 12px rgba(255,180,71,.5)}
    .container{padding:1rem}
    .search{text-align:center;margin-bottom:1rem}
    .search input{padding:.7rem 1rem;width:60%;border-radius:25px;border:2px solid #ffb347}
    .filter-buttons{text-align:center;margin-bottom:1rem}
    .filter-buttons button{margin:0 .3rem;padding:.5rem 1rem;border:none;border-radius:25px;background:#ffb347;color:white;cursor:pointer;transition:.3s}
    .filter-buttons button.active{box-shadow:0 4px 12px rgba(255,180,71,.5)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}
    .card,.cuisine-card,.cuisine-detail-card{border-radius:20px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.2);transition:.3s;cursor:pointer;position:relative}
    .card:hover,.cuisine-card:hover,.cuisine-detail-card:hover{transform:translateY(-10px);box-shadow:0 15px 30px rgba(0,0,0,.3)}
    .card img,.cuisine-detail-card img,.cuisine-card img{width:100%;height:180px;object-fit:cover;border-radius:10px}
    .card-content{padding:1rem}
    .card h3{margin:0 0 .5rem;font-family:'Lobster',cursive;font-size:1.6rem;color:#ff6f61}
    .favorite-btn{position:absolute;top:10px;left:10px;font-size:1.5rem;cursor:pointer;z-index:2;padding:6px 8px;border-radius:50%}
    .badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.85);padding:5px 10px;border-radius:50px;font-size:1.2rem;z-index:2}
    .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:2000}
    .modal{background:#fff;border-radius:15px;max-width:900px;width:92%;padding:1.5rem;max-height:85%;overflow-y:auto}
    .modal h2{text-align:center;color:#ff6f61;font-family:'Lobster',cursive}
    .close-btn{float:right;background:#ff6f61;color:white;border:none;border-radius:25px;padding:.5rem 1rem;cursor:pointer}
    pre,ul{background:#fff0f5;padding:10px;border-radius:10px;overflow-x:auto}
    .cuisine-detail-back{margin-bottom:1rem;display:inline-block;padding:.5rem 1rem;border-radius:25px;background:#ff6f61;color:white;cursor:pointer}
    .meal-day{margin:1rem 0;padding:1rem;border:1px solid #ffb347;border-radius:15px;background:linear-gradient(160deg,#fff5f7,#ffe0e9)}
    .meal-day h3{margin:0 0 .5rem;color:#ff6f61}
    .meal-summary{background:#fff0f5;padding:1rem;border-radius:15px;margin-top:1rem}
    .cuisine-card{display:flex;align-items:center;justify-content:center;height:180px;font-size:1.5rem;text-align:center;color:white;text-shadow:1px 1px 3px rgba(0,0,0,0.5)}
    .cuisine-card:hover{transform:translateY(-5px);box-shadow:0 12px 25px rgba(0,0,0,.25)}
    @media (max-width:600px){
      .search input{width:90%}
      header h1{font-size:2rem}
    }
  </style>
</head>
<body>

  <!-- LOGIN / REGISTER OVERLAY (shows first) -->
  <div id="loginOverlay">
    <div class="bg" aria-hidden="true"></div>

    <div class="login-container">

      <!-- LOGIN FORM -->
      <div id="loginForm">
        <h2>Login to <span class="logo">Flavor<span>Nest</span></span></h2>
        <input id="loginUsername" type="text" placeholder="Username" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button id="loginBtn">Login</button>
        <p class="switch">Don’t have an account? <span id="toRegister">Create Account</span></p>
      </div>

      <!-- REGISTRATION FORM -->
      <div id="registerForm" class="hidden">
        <h2>Create <span class="logo">Flavor<span>Nest</span></span> Account</h2>
        <input id="regUsername" type="text" placeholder="Username" required>
        <input id="regEmail" type="email" placeholder="Email" required>
        <input id="regPassword" type="password" placeholder="Create Password" required>
        <input id="regConfirm" type="password" placeholder="Confirm Password" required>
        <button id="registerBtn">Register</button>
        <p class="switch">Already have an account? <span id="toLogin">Login</span></p>
      </div>

    </div>
  </div>

  <!-- MAIN FLAVORNEST SITE (keeps original markup) -->
  <header>
    <h1>🧑‍🍳 FlavorNest</h1>
    <p class="tagline">Your Gateway to Delicious Recipes & Meal Planning</p>
  </header>

  <nav>
    <button id="navHome" onclick="showPage('home')" class="active">Home</button>
    <button id="navCuisines" onclick="showPage('cuisines')">Cuisines</button>
    <button id="navFavorites" onclick="showPage('favorites')">Favorites</button>
    <button id="navMeal" onclick="showPage('mealPlanner')">Meal Planner</button>
  </nav>

  <div class="container">
    <div class="search"><input id="searchBox" placeholder="Search recipes, cuisines, descriptions..." oninput="renderAll()"/></div>
    <div class="filter-buttons">
      <button id="allBtn" class="active" onclick="setFilter('all')">All</button>
      <button id="vegBtn" onclick="setFilter('veg')">Veg 🥦</button>
      <button id="nonvegBtn" onclick="setFilter('nonveg')">Non-Veg 🍗</button>
    </div>

    <div id="home" class="page"></div>
    <div id="cuisines" class="page" style="display:none"></div>
    <div id="cuisineDetails" class="page" style="display:none"></div>
    <div id="favorites" class="page" style="display:none"></div>
    <div id="mealPlanner" class="page" style="display:none"></div>
  </div>

  <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">Close</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    /***** LOGIN overlay behavior *****/
    const loginOverlay = document.getElementById('loginOverlay');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    document.getElementById('toRegister').addEventListener('click', () => {
      loginForm.classList.add('hidden'); registerForm.classList.remove('hidden');
    });
    document.getElementById('toLogin').addEventListener('click', () => {
      registerForm.classList.add('hidden'); loginForm.classList.remove('hidden');
    });

    // When user clicks Login or Register, close overlay and show main app.
    // (No authentication logic added — matches your original simple behavior.)
    document.getElementById('loginBtn').addEventListener('click', () => {
      loginOverlay.style.display = 'none';
      // optionally focus search box
      setTimeout(()=>{ try{ document.getElementById('searchBox').focus(); }catch(e){} },100);
    });
    document.getElementById('registerBtn').addEventListener('click', () => {
      loginOverlay.style.display = 'none';
      setTimeout(()=>{ try{ document.getElementById('searchBox').focus(); }catch(e){} },100);
    });

    /***** Data & UI constants *****/
    const cIcons = {
      'American':'🥞','Italian':'🍝','Indian':'🍛','Japanese':'🍣','Mexican':'🌮','Thai':'🍜','Dessert':'🍰','Salad':'🥗'
    };
    const gradients = ['#FFD1DC','#FFE4B5','#B0E0E6','#D1FFD6','#E6E6FA','#FFFACD','#F0E68C','#FFB6C1','#E0FFFF'];
    let filter = 'all', mealPlan = {}, weekDays = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    const recipes = [
      {name:'Classic Pancakes',cuisine:'American',type:'veg',time:'20 mins',desc:'Fluffy breakfast pancakes.',img:'https://images.pexels.com/photos/28260046/pexels-photo-28260046.jpeg',ingredients:['1 cup flour','1 tbsp sugar','1 tsp baking powder','1/2 tsp baking soda','1 cup buttermilk','1 egg','2 tbsp butter'],steps:'In a bowl, combine flour, sugar, baking powder, and salt\nIn another bowl, whisk together milk, egg, and melted butter.Pour the wet ingredients into the dry ingredients\nStir gently until just combined (small lumps are okay)\nHeat a non-stick pan or griddle over medium heat and lightly grease it with butter or oil\nPour about ¼ cup of batter onto the pan for each pancake\nCook until bubbles form on the surface (about 1–2 minutes)\nFlip the pancake and cook the other side until golden brown\nStack them up and serve warm with butter, maple syrup, or fruit toppings',favorite:false},
      {name:'Spaghetti Pasta',cuisine:'Italian',type:'veg',time:'25 mins',desc:'Pasta with tomato sauce.',img:'https://images.pexels.com/photos/11654225/pexels-photo-11654225.jpeg',ingredients:['200g spaghetti','Tomatoes','Onion','Garlic','Olive oil','Basil'],steps:'Bring water to a boil in a large pot, add a pinch of salt, and cook the spaghetti for about 8–10 minutes until soft\nDrain the water and drizzle a little olive oil over the pasta to prevent sticking\nHeat olive oil in a pan, sauté chopped onion and garlic until golden brown\nAdd tomato puree or ready-made pasta sauce\nStir and cook for 5–7 minutes\nAdd salt and black pepper\nMix well\nAdd the boiled spaghetti to the sauce and toss gently until fully coated\nGarnish with grated cheese or herbs\nserve hot',favorite:false},
      {name:'Chicken Curry',cuisine:'Indian',type:'nonveg',time:'45 mins',desc:'Spicy chicken curry.',img:'https://images.pexels.com/photos/10445627/pexels-photo-10445627.jpeg',ingredients:['500g chicken','Onions','Tomatoes','Spices','Yogurt'],steps:'sautéing onions, ginger, and garlic in oil until golden\nAdd tomatoes, turmeric, chili, coriander, and garam masala to form a rich masala base\nMix in marinated chicken pieces and cook until coated in spices\nPour water or coconut milk\nsimmer until the chicken is tender and the gravy thickens\nGarnish with fresh coriander',favorite:false},
      {name:'Biryani',cuisine:'Indian',type:'nonveg',time:'1 hr',desc:'Aromatic rice with meat.',img:'https://i.pinimg.com/1200x/79/27/90/79279075dd28543295693a06955e09a5.jpg',ingredients:['Rice','Chicken/mutton','Onions','Tomatoes','Yogurt','Spices'],steps:'Marinate the meat with yogurt, ginger-garlic paste, and spices like turmeric, chili, and garam masala\nPre boil basmati rice with whole spices such as cardamom, cloves, and bay leaves\nFry onions until golden brown and set aside for layering\nLayer rice and marinated meat in a pot, adding fried onions, mint, and saffron milk\nCook on dum (steam) by sealing the pot to trap aroma and flavor until the meat and rice are perfectly done',favorite:false},
      {name:'Sushi Platter',cuisine:'Japanese',type:'nonveg',time:'40 mins',desc:'Assorted sushi rolls.',img:'https://i.pinimg.com/736x/3f/16/88/3f1688a1f808bbcb91cc33411e25836f.jpg',ingredients:['Rice','Nori','Salmon','Avocado','Cucumber'],steps:'Prepare sushi rice by mixing cooked short-grain rice with rice vinegar, sugar, and salt\nSlice fresh fish, seafood, and vegetables into thin, even pieces\nAssemble different sushi types—rolls (maki), hand rolls (temaki), and pressed rice with toppings (nigiri)\nShape and arrange each sushi piece neatly on a platter for visual appeal\nServe with soy sauce, wasabi, and pickled ginger for balanced flavor and presentation',favorite:false},
      {name:'Miso Soup',cuisine:'Japanese',type:'veg',time:'15 mins',desc:'Classic Japanese soup.',img:'https://i.pinimg.com/1200x/af/95/a8/af95a8151cbef4170465b71e77ceab99.jpg',ingredients:['Miso paste','Tofu','Seaweed','Spring onions'],steps:'Boil 2 cups of dashi (or vegetable broth) in a pot on medium flame\nAdd small cubes of tofu and soaked seaweed (wakame)\nCook gently for 2–3 minutes\nTake a small bowl, add a little hot broth, and dissolve 2 tbsp miso paste in it until smooth\nPour the dissolved miso back into the pot\n(Do not boil after adding miso)\nAdd chopped green onions and stir lightly\nServe hot\nenjoy your flavorful miso soup',favorite:false},
      {name:'Chicken Teriyaki',cuisine:'Japanese',type:'nonveg',time:'30 mins',desc:'Sweet & savory chicken teriyaki.',img:'https://i.pinimg.com/1200x/30/a6/37/30a637e11d698e97d728cb5feb3ae7c6.jpg',ingredients:['Chicken','Soy sauce','Sugar','Mirin','Ginger','Garlic'],steps:'Prepare the sauce by mixing soy sauce, mirin, sake, and sugar, then simmer until slightly thick\nSeason chicken pieces (usually thighs) lightly with salt and pepper\nPan-sear or grill the chicken until golden brown and fully cooked\nPour the teriyaki sauce over the chicken and let it glaze while simmering\nServe hot with steamed rice and vegetables, garnished with sesame seeds or green onions',favorite:false},
      {name:'Salmon Teriyaki',cuisine:'Japanese',type:'nonveg',time:'35 mins',desc:'Salmon with teriyaki sauce.',img:'https://i.pinimg.com/1200x/4c/c1/5a/4cc15a8f87c94354574cc059481123cc.jpg',ingredients:['Salmon','Soy sauce','Sugar','Mirin','Ginger'],steps:'Make the teriyaki sauce by combining soy sauce, mirin, sake, and sugar, then simmer until glossy\nSeason fresh salmon fillets lightly with salt and pat them dry\nPan-sear or grill the salmon until the skin is crisp and the inside is tender\nBrush or pour the sauce over the salmon, letting it caramelize gently\nServe immediately with steamed rice and vegetables for a savory-sweet meal',favorite:false},
      {name:'Chicken Katsu',cuisine:'Japanese',type:'nonveg',time:'45 mins',desc:'Crispy fried chicken cutlet.',img:'https://i.pinimg.com/736x/38/ab/f8/38abf862b6edba164541ee1d76fdd1b1.jpg',ingredients:['Chicken','Flour','Egg','Panko breadcrumbs','Oil'],steps:'Flatten boneless chicken breasts to an even thickness using a meat mallet\nCoat the chicken in flour, dip it in beaten egg, and cover with panko breadcrumbs\nHeat oil in a pan and deep-fry the chicken until golden brown and crispy\nSlice the cooked chicken into strips for easy serving\nServe hot with tonkatsu sauce, shredded cabbage, and steamed rice',favorite:false},
      {name:'Ramen',cuisine:'Japanese',type:'nonveg',time:'40 mins',desc:'Noodle soup with toppings.',img:'https://i.pinimg.com/1200x/b9/8b/54/b98b54021ba88b02ff04666c21e845de.jpg',ingredients:['Noodles','Broth','Pork/Chicken','Eggs','Vegetables'],steps:'Prepare the broth by simmering pork bones, chicken, or miso with aromatics for rich flavor\nBoil ramen noodles until chewy, then drain well\nPrepare toppings like sliced chashu pork, soft-boiled eggs, nori, and green onions\nAssemble the bowl by adding noodles, pouring in hot broth, and arranging toppings neatly\nFinish with flavor oils or sauces like sesame oil or chili paste, then serve immediately',favorite:false},
      {name:'Rice Balls (Tuna Mayo Onigiri)',cuisine:'Japanese',type:'nonveg',time:'20 mins',desc:'Rice balls with tuna mayo.',img:'https://i.pinimg.com/1200x/da/e0/1f/dae01fe98c757e87c5941025bc0b0004.jpg',ingredients:['Rice','Tuna','Mayonnaise','Seaweed'],steps:'Cook short-grain Japanese rice until soft and slightly sticky\nSeason the rice lightly with salt while it’s still warm\nShape the rice into triangles or rounds using wet or salted hands\nAdd fillings like salted salmon, pickled plum (umeboshi), or tuna mayo inside if desired\nWrap with nori (seaweed) and serve as a simple, portable Japanese snack',favorite:false},

      {name:'Sambar',cuisine:'Indian',type:'veg',time:'40 mins',desc:'South Indian lentil stew.',img:'https://i.pinimg.com/1200x/b7/12/89/b71289235e68ac42449da196d912e59a.jpg',ingredients:['Toor dal','Tamarind','Vegetables','Sambar powder'],steps:'Wash and cook toor dal in a pressure cooker with enough water until soft and mushy\nMash well\nBoil the chopped vegetables in water until tender\nIn a pan, heat oil, add mustard seeds, let them splutter\nAdd curry leaves and chopped onion\nsauté until golden\nAdd chopped tomato and cook until soft\nAdd boiled vegetables, mashed dal, sambar powder, salt, and tamarind pulp. Mix well\nAdd water as needed to adjust consistency\nBoil the sambar for 5–10 minutes\nGarnish with coriander leaves\nserve hot',favorite:false},
      {name:'Paneer Butter Masala',cuisine:'Indian',type:'veg',time:'45 mins',desc:'Creamy paneer curry.',img:'https://images.pexels.com/photos/9609838/pexels-photo-9609838.jpeg',ingredients:['Paneer','Tomatoes','Onions','Butter','Cream','Spices'],steps:'Heat oil and butter in a pan\nAdd chopped onions and sauté until golden brown\nAdd ginger-garlic paste and cook until the raw smell goes away\nAdd tomato puree, red chili powder, turmeric, and salt\nCook until the oil separates from the masala\nPour in some water and let the gravy simmer for 3–4 minutes\nAdd paneer cubes and cook for 2–3 minutes on low flame\nStir in fresh cream and garam masala. Mix well and cook for another minute\nGarnish with coriander leaves\nserve hot',favorite:false},
      {name:'Tacos',cuisine:'Mexican',type:'nonveg',time:'30 mins',desc:'Corn tortillas with meat.',img:'https://images.pexels.com/photos/5837196/pexels-photo-5837196.jpeg',ingredients:['Taco shells','Beef','Lettuce','Cheese','Salsa'],steps:'Prepare the filling\nIn a pan, heat oil and cook your choice of meat or veggies with taco seasoning until well done and flavorful\nWarm the tortillas\nHeat corn tortillas on a pan for about 20–30 seconds each side until soft and slightly golden\nAssemble tacos\nPlace the cooked filling in the center of each tortilla\nAdd toppings\nSprinkle chopped onion, tomato, coriander, and cheese (if desired)\nServe and enjoy\nSqueeze fresh lime juice on top and serve with salsa or sour cream',favorite:false},
      {name:'Pad Thai',cuisine:'Thai',type:'nonveg',time:'35 mins',desc:'Stir-fried noodles with shrimp.',img:'https://images.pexels.com/photos/12561883/pexels-photo-12561883.jpeg',ingredients:['Noodles','Shrimp','Eggs','Sprouts','Peanuts'],steps:'Cook the noodles\nBoil rice noodles until soft (about 5 minutes), then drain and set aside\nPrepare the sauce\nMix soy sauce, tamarind paste, and sugar in a small bowl\nCook protein and veggies\nIn a pan or wok, heat oil and cook tofu or shrimp/chicken until golden\nAdd veggies and stir-fry briefly\nAdd noodles and eggs\nPush everything to one side, crack eggs on the other side, scramble them, then mix with noodles and sauce\nFinish and serve\nStir well for 1–2 minutes, garnish with crushed peanuts and lime wedges, and serve hot',favorite:false},

      {name:'Chocolate Cake',cuisine:'Dessert',type:'veg',time:'1 hr',desc:'Rich chocolate cake.',img:'https://images.pexels.com/photos/6341572/pexels-photo-6341572.jpeg',ingredients:['Flour','Sugar','Cocoa','Eggs','Milk'],steps:'Preheat oven to 180°C (350°F) and grease a cake tin with butter or oil\nIn a bowl, mix all dry ingredients – flour, cocoa powder, baking powder, baking soda, and sugar\nAdd wet ingredients – milk, eggs (or curd), oil, and vanilla essence.\nMix well to form a smooth batter\nAdd ½ cup hot water gradually and mix until the batter is lump-free\nPour the batter into the greased cake tin\nBake for 30–35 minutes or until a toothpick comes out clean\nLet it cool completely before removing from the tin\nFrost with chocolate ganache or buttercream\nserve',favorite:false},
      {name:'Classic Chocolate Brownie',cuisine:'Dessert',type:'veg',time:'50 mins',desc:'Rich fudgy chocolate brownie.',img:'https://images.pexels.com/photos/25595974/pexels-photo-25595974.jpeg',ingredients:['200g dark chocolate','150g butter','200g sugar','3 eggs','100g flour'],steps:'Preheat oven to 180°C (350°F) and grease a square baking tray with butter or line it with parchment paper\nIn a bowl, mix melted butter and sugar until smooth\nAdd eggs one by one and whisk well\nThen add vanilla essence\nSift together flour, cocoa powder, salt, and baking powder\nAdd the dry ingredients to the wet mixture and mix gently until combined don’t overmix\nFold in choco chips or chunks if desired\nPour the batter into the prepared tray and spread evenly\nBake for 20–25 minutes or until the top is set but slightly fudgy inside\nCool completely, cut into squares, and enjoy',favorite:false},
      {name:'Fruit Custard',cuisine:'Dessert',type:'veg',time:'30 mins',desc:'Creamy fruit custard.',img:'https://i.pinimg.com/1200x/94/a3/c8/94a3c8bab1c6e3ff2c973b8f95864b0c.jpg',ingredients:['Milk','Custard powder','Sugar','Mixed fruits'],steps:'Take 2 tbsp custard powder in a small bowl\nmix it with 2 tbsp cold milk to make a smooth paste no lumps\nBoil 2 cups of milk in a pan over medium flame\nAdd sugar and stir until it dissolves\nSlowly add the custard paste to the boiling milk while stirring continuously to avoid lumps\nCook for 2–3 minutes until the mixture thickens, then turn off the flame\nLet it cool completely, then refrigerate for 1–2 hours\nBefore serving, add chopped fruits and mix gently\n\nenjoy your creamy fruit custard\nServe chilled',favorite:false},
      {name:'Carrot Halwa',cuisine:'Dessert',type:'veg',time:'1 hr',desc:'Sweet carrot pudding.',img:'https://i.pinimg.com/736x/fc/ab/4b/fcab4bb6c964cf2bfc4e7ebbcdfc9beb.jpg',ingredients:['Carrots','Milk','Sugar','Ghee','Cardamom'],steps:'Wash, peel, and grate the carrots finely\nIn a heavy-bottomed pan, add the grated carrots and milk\nCook on medium heat until the milk reduces and the carrots are soft (15–20 minutes)\nAdd sugar and continue to cook, stirring occasionally, until the mixture thickens\nAdd ghee and crushed cardamomn\nMix well and cook for another 5–7 minutes until ghee separates from the halwa\nGarnish with nuts and raisins\nServe warm',favorite:false},
      {name:'Cheesecake',cuisine:'Dessert',type:'veg',time:'1 hr',desc:'Classic baked cheesecake.',img:'https://images.pexels.com/photos/3071870/pexels-photo-3071870.jpeg',ingredients:['Cream cheese','Sugar','Eggs','Graham crackers','Butter'],steps:'Mix crushed biscuits with melted butter and press into the base of a springform pan\nChill in the fridge for 10–15 minutes\nIn a bowl, beat cream cheese and sugar until smooth\nAdd eggs one by one, mixing well after each addition\nThen add vanilla essence and heavy cream\nPour the filling over the chilled biscuit base and smooth the top\nBake in a preheated oven at 160°C (320°F) for 40–50 minutes, or until the center is set but slightly wobbly\nCool at room temperature, then refrigerate for at least 4 hours (or overnight) to set\nDecorate with fruits, chocolate, or caramel before serving',favorite:false},
      {name:'Kheer',cuisine:'Dessert',type:'veg',time:'45 mins',desc:'Rice pudding dessert.',img:'https://i.pinimg.com/1200x/11/e5/f6/11e5f6e011f27c4031d1d6cca8af3a53.jpg',ingredients:['Rice','Milk','Sugar','Cardamom','Nuts'],steps:'Wash the rice thoroughly and soak for 20–30 minutes\nBoil milk in a heavy-bottomed pan over medium heat\nAdd the soaked rice to the boiling milk\nCook on low heat, stirring occasionally, until the rice is soft and the milk thickens 20–25 minute\nAdd sugar and crushed cardamom\nMix well and cook for another 5 minutes\nAdd chopped nuts and raisins. Stir and cook for 2–3 more minutes\nServe hot or chilled, garnished with extra nuts if desired',favorite:false},
      {name:'Apricot Delight',cuisine:'Dessert',type:'veg',time:'40 mins',desc:'Fruity apricot dessert.',img:'https://i.pinimg.com/1200x/23/2f/40/232f405f2652950272fbad93c3535a0b.jpg',ingredients:['Apricots','Sugar','Gelatin','Cream'],steps:'Soak dried apricots in warm water for 15–20 minutes to soften them\nBlend the soaked apricots with milk to make a smooth puree\nIn a bowl, mix the apricot puree with condensed milk, cream, sugar (if needed), and cardamom powder\nWhisk well until smooth and creamy\nPour into serving bowls or glasses and refrigerate for 1–2 hours to chill\nGarnish with chopped nuts before serving',favorite:false},
      {name:'Ice Cream',cuisine:'Dessert',type:'veg',time:'30 mins',desc:'Classic creamy ice cream.',img:'https://i.pinimg.com/1200x/46/5c/24/465c24b204e0a748f84e8c8f2503b51d.jpg',ingredients:['Milk','Cream','Sugar','Vanilla essence'],steps:'Whip the heavy cream in a bowl until stiff peaks form\nIn another bowl, mix condensed milk and vanilla essence\nGently fold the whipped cream into the condensed milk mixture until well combined\nAdd any optional mix-ins like chocolate chips or chopped fruits\nPour the mixture into a freezer-safe container and cover it\nFreeze for 6–8 hours or overnight\nScoop and serve chilled',favorite:false},
      {name:'Laddu',cuisine:'Dessert',type:'veg',time:'35 mins',desc:'Sweet round Indian dessert.',img:'https://images.pexels.com/photos/19151502/pexels-photo-19151502.jpeg',ingredients:['Besan','Sugar','Ghee','Cardamom'],steps:'Heat ghee in a pan on low-medium flame\nAdd besan and roast it slowly, stirring continuously until it turns golden brown and aromatic 10–12 minutes\nTurn off the heat and let it cool slightly warm, not hot\nAdd powdered sugar and cardamom powder\nMix well\nTake small portions of the mixture and shape into round balls (laddus) using your palms\nGarnish with nuts if desired. Store in an airtight container',favorite:false},

      {name:'Buffalo Wings',cuisine:'American',type:'nonveg',time:'30 mins',desc:'Spicy chicken wings in buffalo sauce.',img:'https://i.pinimg.com/736x/e1/6c/6a/e16c6abdb9e04596239436e47178c1cc.jpg',ingredients:['Chicken wings','Hot sauce','Butter','Spices'],steps:'Prepare the chicken wings by cleaning and patting them dry\nDeep-fry or bake the wings until golden brown and crispy\nMake the buffalo sauce by melting butter and mixing with hot sauce\nToss the cooked wings in the buffalo sauce until evenly coated\nServe hot with celery sticks and blue cheese or ranch dressing',favorite:false},

      {name:'Gnocchi',cuisine:'Italian',type:'veg',time:'40 mins',desc:'Soft potato dumplings served with creamy or tomato sauce.',img:'https://i.pinimg.com/736x/13/77/67/137767fe8b15f45660af2a70d1222098.jpg',ingredients:['medium potatoes','flour','egg yolk','Salt','butter','grated Parmesan'],steps:'Boil potatoes until soft\nPeel and mash until smooth\nLet them cool slightly\nIn a bowl, combine mashed potatoes, flour, egg, salt, and nut\nKnead gently to form a soft, smooth dough\nAvoid overmixing\nDivide dough into small portions\nRoll each portion into a long rope\npress lightly with a fork to create ridges\nBoil water in a large pot with salt\nDrop gnocchi in boiling water\nCook until they float to the surface\nRemove with a slotted spoon and drain\nToss cooked gnocchi with pasta sauce, butter, or olive oil\nGarnish with parmesan and herbs',favorite:false}
    ];

    /***** Utility & rendering functions *****/
    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
      document.getElementById(f + 'Btn')?.classList.add('active');
      renderAll();
    }

    function showPage(p) {
      // hide all pages
      document.querySelectorAll('.page').forEach(d => d.style.display = 'none');
      // show selected
      document.getElementById(p).style.display = 'block';
      // nav active state
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      if (p === 'home') document.getElementById('navHome').classList.add('active');
      if (p === 'cuisines') document.getElementById('navCuisines').classList.add('active');
      if (p === 'favorites') document.getElementById('navFavorites').classList.add('active');
      if (p === 'mealPlanner') document.getElementById('navMeal').classList.add('active');
      renderAll();
      if (p === 'mealPlanner') renderMealPlanner();
    }

    function renderAll() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filtered = recipes.filter(r =>
        (filter === 'all' ||
         (filter === 'veg' && r.type === 'veg') ||
         (filter === 'nonveg' && r.type === 'nonveg'))
        && (r.name.toLowerCase().includes(query) ||
            r.cuisine.toLowerCase().includes(query) ||
            (r.desc && r.desc.toLowerCase().includes(query)))
      );
      renderSection('home', filtered);
      renderFavorites(); // updates favorites section
      renderCuisines();
    }

    function renderSection(id, data) {
      const el = document.getElementById(id);
      if (!data || data.length === 0) {
        el.innerHTML = '<p style="text-align:center;">No recipes to show.</p>';
        return;
      }
      el.innerHTML = `<div class='grid'>${data.map((r,i) =>
        `<div class='card' style="background:${gradients[i % gradients.length]}" onclick="showRecipeDetail(${recipes.indexOf(r)})">
           <div class="favorite-btn" onclick="event.stopPropagation();toggleFavorite(${recipes.indexOf(r)})">${r.favorite ? '❤' : '🤍'}</div>
           <div class="badge">${cIcons[r.cuisine] || '🍴'} ${r.type === 'veg' ? '🥦' : '🍗'}</div>
           <img src='${r.img || 'https://via.placeholder.com/600x400?text=No+Image'}' alt="${r.name}"/>
           <div class='card-content'><h3>${r.name}</h3><p><b>${r.cuisine}</b>: ${r.desc}<br><b>Time:</b> ${r.time}</p></div>
         </div>`).join('')}</div>`;
    }

    function toggleFavorite(i) {
      recipes[i].favorite = !recipes[i].favorite;
      renderAll();
    }

    function renderFavorites() {
      const favs = recipes.filter(r => r.favorite);
      const el = document.getElementById('favorites');
      if (!favs.length) {
        el.innerHTML = '<p style="text-align:center;">No favorites yet! ❤ Click the heart on any recipe to add.</p>';
        return;
      }
      el.innerHTML = `<div class='grid'>${favs.map((r,i) =>
        `<div class='cuisine-detail-card' style="background:${gradients[i % gradients.length]}" onclick="showRecipeDetail(${recipes.indexOf(r)})">
           <div class="badge">${cIcons[r.cuisine] || '🍴'} ${r.type === 'veg' ? '🥦' : '🍗'}</div>
           <img src='${r.img || 'https://via.placeholder.com/600x400?text=No+Image'}' alt="${r.name}"/>
           <div class='card-content'><h3>${r.name}</h3><p>${r.desc}<br><b>Time:</b> ${r.time}</p></div>
         </div>`).join('')}</div>`;
    }

    function renderCuisines() {
      const cSet = [...new Set(recipes.map(r => r.cuisine))];
      const el = document.getElementById('cuisines');
      if (!cSet.length) { el.innerHTML = '<p>No cuisines found.</p>'; return; }
      el.innerHTML = `<div class='grid'>${cSet.map((c,i) =>
        `<div class='cuisine-card' style="background:${gradients[i % gradients.length]}" onclick="showCuisineDetails('${c}')"><h3>${cIcons[c] || '🍴'} ${c}</h3></div>`
      ).join('')}</div>`;
    }

    function showCuisineDetails(c) {
      const el = document.getElementById('cuisineDetails');
      const list = recipes.filter(r => r.cuisine === c);
      el.innerHTML = `<span class="cuisine-detail-back" onclick="showPage('cuisines')">⬅ Back</span>
        <h2 style="color:#ff6f61;font-family:'Lobster',cursive;text-align:center;margin-top:0">${cIcons[c] || ''} ${c}</h2>
        <div class='grid'>${list.map((r,i)=>
          `<div class='cuisine-detail-card' style="background:${gradients[i % gradients.length]}" onclick="showRecipeDetail(${recipes.indexOf(r)})">
             <div class="badge">${cIcons[r.cuisine] || '🍴'} ${r.type === 'veg' ? '🥦' : '🍗'}</div>
             <img src='${r.img || 'https://via.placeholder.com/600x400?text=No+Image'}' alt="${r.name}"/>
             <div class='card-content'><h3>${r.name}</h3><p>${r.desc}<br><b>Time:</b> ${r.time}</p></div>
           </div>`
        ).join('')}</div>`;
      showPage('cuisineDetails');
    }

    function showRecipeDetail(i) {
      const r = recipes[i];
      if (!r) return;
      document.getElementById('modalContent').innerHTML = `<h2>${r.name}</h2>
        <p style="text-align:center;"><b>Cuisine:</b> ${r.cuisine} ${cIcons[r.cuisine] || '🍴'}</p>
        <p style="text-align:center;"><b>Time:</b> ${r.time}</p>
        <img src="${r.img || 'https://via.placeholder.com/900x400?text=No+Image'}" style="width:100%;border-radius:10px;margin-bottom:10px;">
        <h3>Ingredients:</h3><ul>${(r.ingredients||[]).map(x => `<li>${x}</li>`).join('')}</ul>
        <h3>Steps:</h3><pre>${r.steps || ''}</pre>`;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal(e){
      // if called by clicking overlay or close button
      if (!e || e.target === document.getElementById('modalOverlay')) {
        document.getElementById('modalOverlay').style.display = 'none';
      }
    }

    function renderMealPlanner() {
      const div = document.getElementById('mealPlanner');
      div.innerHTML = `<h2 style="text-align:center;">Weekly Meal Planner</h2>${weekDays.map(day =>
        `<div class="meal-day"><h3>${day}</h3><select onchange="mealPlan['${day}']=this.value;renderMealSummary()">
           <option value="">-- Select Recipe --</option>${recipes.map((r,i) =>
             `<option value="${i}" ${mealPlan[day] == i ? 'selected' : ''}>${r.name} ${r.type === 'veg' ? '🥦' : '🍗'}</option>`
           ).join('')}</select></div>`
      ).join('')}<div id="mealSummary" class="meal-summary"></div>`;
      renderMealSummary();
    }

    function renderMealSummary() {
      document.getElementById('mealSummary').innerHTML = `<h3>Meal Plan Summary</h3><ul>${weekDays.map(d =>
        `<li><b>${d}:</b> ${mealPlan[d] !== undefined && mealPlan[d] !== "" ? recipes[mealPlan[d]].name : '--No selection--'}</li>`
      ).join('')}</ul>`;
    }

    // initial render
    renderAll();
    showPage('home');

  </script>
</body>
</html>
